<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | ParkEase</title>

    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
    .password-eye {
        position: absolute;
        right: 10px;
        top: 12px;
        font-size: 14px;
        color: #aaa;
        cursor: pointer;
    }

    .password-eye:hover {
        color: #333;
    }
    </style>
</head>

<body>

<header class="app-header">
    <div class="logo">
        <i class="fa-solid fa-square-parking"></i> ParkEase
    </div>
</header>

<div class="page-center">

<div class="auth-box">
    <h1>
        <i class="fa-solid fa-square-parking"></i> ParkEase
    </h1>

    <p class="tagline">Create Your Account</p>

    <form onsubmit="registerUser(event)">
        <input type="text" id="name" placeholder="👤 Your Name" required>
        <input type="email" id="email" placeholder="📧 Email Address" required>

        <!-- ✅ Password with Eye -->
        <div style="position:relative;">
            <input type="password" id="password" placeholder="🔒 Password" required style="width:100%; padding-right:35px;">
            <i class="fa-solid fa-eye-slash password-eye" onclick="togglePassword('password', this)"></i>
        </div>
        <div style="position:relative;">
    <input type="password" id="confirmPassword" placeholder="🔒 Confirm Password" required style="width:100%; padding-right:35px;">
    <i class="fa-solid fa-eye-slash password-eye" onclick="togglePassword('confirmPassword', this)"></i>
</div>

        <button type="submit">Register</button>
    </form>

    <p class="link-text">
        Already have an account? <a href="login.html">Login</a>
    </p>
</div>

</div>

<script>
function registerUser(event){
    event.preventDefault();

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();
    const confirmPassword = document.getElementById("confirmPassword").value.trim();

    const emailPattern = /^[a-zA-Z0-9._%+-]+@gmail\.com$/;

    if(!name || !email || !password){
        alert("Please fill all fields");
        return;
    }

    if(!emailPattern.test(email)){
        alert("Enter valid Gmail (example@gmail.com)");
        return;
    }

    if(password.length < 6){
        alert("Password must be at least 6 characters");
        return;
    }
    if(password !== confirmPassword){
    alert("Passwords do not match ❌");
    return;
}

    fetch("http://localhost:3000/users/register", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            name: name,
            email: email,
            password: password
        })
    })
    .then(res => res.json())
    .then(data => {

        if (!data.success) {
            alert(data.message || "Registration failed");
            return;
        }

        alert("Registration Successful ✅");
        window.location.href = "login.html";
    })
    .catch(err => {
        console.error(err);
        alert("Error connecting to server");
    });
}

function togglePassword(id, icon){
    const input = document.getElementById(id);

    if(input.type === "password"){
        input.type = "text";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
    } else {
        input.type = "password";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
    }
}
</script>

</body>
</html>
