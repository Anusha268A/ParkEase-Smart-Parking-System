<!DOCTYPE html>
<html>
<head>
<title>My Profile | ParkEase</title>

<link rel="stylesheet" href="css/dashboard-ui.css">
<link rel="stylesheet" href="css/profile.css">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
body{
    margin:0;
    padding-top: 20px;
}
</style>

</head>
<body>

<div class="layout">

<!-- Sidebar -->
    <aside class="sidebar">
        <h2 class="brand">
            <i class="fa-solid fa-square-parking"></i> ParkEase
        </h2>

        <ul>
            <li onclick="goDashboard()"><i class="fa-solid fa-gauge"></i> Dashboard</li>
            <li onclick="goExplore()"><i class="fa-solid fa-compass"></i> Explore Lots</li>
            <li onclick="goBookings()"><i class="fa-solid fa-receipt"></i> My Bookings</li>
            <li onclick="goProfile()"><i class="fa-solid fa-user"></i> Profile</li>
            <li onclick="goAnalytics()"><i class="fa-solid fa-chart-line"></i> My Analytics</li>
            <li class="logout" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</li>
        </ul>
    </aside>


<main class="main">

<div class="topbar">
    <h2>
        <i class="fa-solid fa-user"></i> My Profile
    </h2>
</div>

<!-- PROFILE -->
<div class="card profile-card">
    <div class="avatar">
        <i class="fa-solid fa-user-circle"></i>
    </div>

    <h3 id="username"></h3>
    <p>Email: <span id="email"></span></p>
    <p>Status: <span class="active">ACTIVE</span></p>
</div>

<!-- STATS -->
<div class="stats">
    <div class="card">Total Bookings<br><strong id="totalBookings">0</strong></div>
    <div class="card">Total Spent<br><strong>₹0</strong></div>
    <div class="card">Member Since<br><strong>2026</strong></div>
</div>

</main>
</div>

<script>

/* ✅ Get logged user */
const user = JSON.parse(localStorage.getItem("user"));

if (!user) {
    window.location.href = "login.html";
}

/* ✅ Set user details */
document.getElementById("username").innerText = user.name;
document.getElementById("email").innerText = user.email;

/* ✅ Fetch bookings count from backend */
fetch(`http://localhost:3000/bookings/${user.email}`)
  .then(res => res.json())
  .then(data => {
      document.getElementById("totalBookings").innerText = data.length;
  })
  .catch(err => console.error(err));

/* Navigation */
function goDashboard(){ window.location.href="dashboard.html"; }
function goExplore(){ window.location.href="explore.html"; }
function goBookings(){ window.location.href="mybookings.html"; }
function goProfile(){ window.location.href="profile.html"; }
function goAnalytics(){ window.location.href="analytics.html"; }

function logout(){
    localStorage.removeItem("user");
    window.location.href="login.html";
}
</script>

</body>
</html>
