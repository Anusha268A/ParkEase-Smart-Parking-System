<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment | ParkEase</title>

    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        body{
            margin:0;
            font-family:"Segoe UI", sans-serif;
            background:#f4f7fb;
            padding-top:90px;
        }

        .app-header{
            position:fixed;
            top:0;
            width:100%;
            height:70px;
            background:#004aad;
            display:flex;
            justify-content:center;
            align-items:center;
            color:white;
            font-size:22px;
            font-weight:700;
        }

        .page-center{
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:calc(100vh - 90px);
        }

        .payment-box{
            background:white;
            width:360px;
            padding:25px;
            border-radius:12px;
            box-shadow:0 10px 25px rgba(0,0,0,0.15);
        }

        h3{
            text-align:center;
            margin-bottom:20px;
        }

        p{
            margin:10px 0;
        }

        .methods{
            margin:15px 0;
        }

        .methods label{
            display:block;
            margin-bottom:8px;
        }

        button{
            width:100%;
            padding:12px;
            background:#004aad;
            color:white;
            border:none;
            border-radius:6px;
            cursor:pointer;
        }

        button:hover{
            background:#003080;
        }
    </style>
</head>

<body>

<header class="app-header">
    <i class="fa-solid fa-credit-card"></i>&nbsp; Payment
</header>

<div class="page-center">
    <div class="payment-box">

        <h3>Payment Summary</h3>

        <p><strong>Parking Lot:</strong> <span id="lot"></span></p>
        <p><strong>Slot:</strong> <span id="slot"></span></p>
        <p><strong>Amount:</strong> ₹<span id="amount"></span></p>
        <p><strong>Vehicle:</strong> <span id="vehicle"></span></p>

        <div class="methods">
            <p><strong>Select Payment Method</strong></p>
            <label><input type="radio" name="pay" checked> UPI</label>
            <label><input type="radio" name="pay"> Card</label>
            <label><input type="radio" name="pay"> Cash</label>
        </div>

        <button onclick="makePayment()">
            <i class="fa-solid fa-lock"></i> Pay Now
        </button>

    </div>
</div>

<script>

/* ✅ GET BOOKING DATA */
const ticket = JSON.parse(localStorage.getItem("ticket"));

if(!ticket){
    alert("No booking found ❌");
    window.location.href = "dashboard.html";
}

/* ✅ DISPLAY DATA */
document.getElementById("lot").innerText = ticket.lot_name;
document.getElementById("slot").innerText = ticket.slot_number;
document.getElementById("vehicle").innerText = ticket.vehicle_type;

/* ✅ PRICE LOGIC */
let price = 30;

if(ticket.lot_name.includes("Mall")) price = 40;
else if(ticket.lot_name.includes("Office")) price = 25;

document.getElementById("amount").innerText = price;

/* ✅ PAYMENT */
function makePayment(){

    const btn = document.querySelector("button");
    btn.innerText = "Processing...";
    btn.disabled = true;

    setTimeout(() => {

        alert("💳 Payment Successful!");

        // 🔥 REDIRECT TO CONFIRMATION
        window.location.href = "confirmation.html";

    }, 1200);
}

</script>

</body>
</html>
