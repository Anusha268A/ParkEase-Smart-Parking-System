<!DOCTYPE html>
<html>
<head>
<title>Manage Users | ParkEase</title>

<link rel="stylesheet" href="css/admin.css">
<link rel="stylesheet" href="css/admin-users.css">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>
<body>

<div class="layout">

<!-- Sidebar -->
<aside class="sidebar">
    <h2 class="brand">
        <i class="fa-solid fa-square-parking"></i> ParkEase
    </h2>

    <ul>

    <li onclick="goBird()">
        <i class="fa-solid fa-eye"></i> Bird's Eye
    </li>

    <li onclick="goParking()">
        <i class="fa-solid fa-warehouse"></i> Parking Lots
    </li>

    <li onclick="goUsers()">
        <i class="fa-solid fa-users"></i> Users
    </li>

    <li onclick="goReservations()">
        <i class="fa-solid fa-calendar-check"></i> Reservations
    </li>

    <li class="logout" onclick="logout()">
        <i class="fa-solid fa-right-from-bracket"></i> Logout
    </li>

    </ul>
</aside>

<!-- Main -->
<main class="main">

<h2>
    <i class="fa-solid fa-users"></i> Manage Users
</h2>

<!-- Stats -->
<div class="stats">
    <div class="card">Total Users<br><strong id="totalUsers">0</strong></div>
    <div class="card">Admins<br><strong id="totalAdmins">0</strong></div>
    <div class="card">Active Users<br><strong id="activeUsers">0</strong></div>
</div>

<!-- Users Table -->
<table class="users-table">
<thead>
<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Email</th>
    <th>Role</th>
    <th>Joined</th>
</tr>
</thead>

<tbody id="usersList"></tbody>
</table>

</main>
</div>

<script>

/* 🔒 Admin check */
const currentUser = JSON.parse(localStorage.getItem("user"));

if (!currentUser || currentUser.email !== "admin@gmail.com") {
    alert("Access denied ❌");
    window.location.href = "login.html";
}

/* ✅ Load Users from Backend */
async function loadUsers(){
    try {
        let res = await fetch("http://localhost:3000/users");
        let users = await res.json();

        const container = document.getElementById("usersList");
        container.innerHTML = "";

        let adminCount = 0;

        users.forEach(u => {

            const isAdmin = u.email === "admin@gmail.com";

            if(isAdmin) adminCount++;

            const role = isAdmin
                ? '<span class="role admin">ADMIN</span>'
                : '<span class="role user">USER</span>';

            const row = `
            <tr>
                <td>#${u.id || "-"}</td>
                <td>${u.name || "N/A"}</td>
                <td>${u.email}</td>
                <td>${role}</td>
                <td>${new Date().toDateString()}</td>
            </tr>
            `;

            container.innerHTML += row;
        });

        // Update stats
        document.getElementById("totalUsers").innerText = users.length;
        document.getElementById("totalAdmins").innerText = adminCount;
        document.getElementById("activeUsers").innerText = users.length - adminCount;

    } catch(err){
        console.error("Error loading users:", err);
        alert("Error loading users");
    }
}

loadUsers();

/* Navigation */
function goBird(){
    window.location.href = "admin.html";
}

function goUsers(){
    window.location.href = "admin-users.html";
}

function goReservations(){
    window.location.href = "admin-reservations.html";
}

function goParking(){
    window.location.href = "admin-parking.html";
}

function logout(){
    localStorage.clear();
    window.location.href = "login.html";
}
</script>

</body>
</html>
